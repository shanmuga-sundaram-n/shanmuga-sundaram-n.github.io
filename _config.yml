title: "Shanmuga Sundaram Natarajan's Personal Website"
description: "Hands-on Architect & Technical Leader | 19+ Years Experience | AI-First Software Delivery"
author: Shanmuga Sundaram Natarajan (Shan)
email: urmail2ss@gmail.com
buttondown_username: "shanmuga_sundaram" # Set your Buttondown username after signing up at buttondown.email
baseurl: "" # GitHub Pages subdirectory
url: "https://shanmuga-sundaram-n.github.io"

# Disable default theme to use custom CSS
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

future: true

markdown: kramdown
highlighter: rouge

# Permalink structure
permalink: /blog/:year/:month/:day/:title/

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Social links
social_links:
  - name: "GitHub"
    url: "https://github.com/shanmuga-sundaram-n"
    icon: "fab fa-github"
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/shan-profile/"
    icon: "fab fa-linkedin"