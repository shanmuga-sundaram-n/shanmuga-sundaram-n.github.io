<section class="subscribe-section">
  <div class="subscribe-inner">
    <div class="subscribe-icon">
      <i class="fas fa-envelope-open-text"></i>
    </div>
    <h2 class="subscribe-title">Stay in the loop</h2>
    <p class="subscribe-description">
      Get notified when I publish new articles on architecture, AI, and engineering.
      No spam, just good technical content.
    </p>

    <form class="subscribe-form" id="subscribe-form" novalidate>
      <div class="subscribe-input-group">
        <input
          type="email"
          id="subscribe-email"
          name="email"
          class="subscribe-input"
          placeholder="your@email.com"
          autocomplete="email"
          required
        />
        <button type="submit" class="subscribe-btn" id="subscribe-btn">
          <span class="btn-text">Subscribe</span>
          <span class="btn-loading" hidden>
            <i class="fas fa-spinner fa-spin"></i>
          </span>
        </button>
      </div>
      <div class="subscribe-feedback" id="subscribe-feedback" hidden></div>
    </form>

    <p class="subscribe-note">
      <i class="fas fa-rss"></i>
      Prefer RSS? <a href="{{ '/feed.xml' | relative_url }}" target="_blank" rel="noopener">Subscribe via feed</a>
    </p>
  </div>
</section>

<script>
(function () {
  const form = document.getElementById('subscribe-form');
  if (!form) return;

  const emailInput = document.getElementById('subscribe-email');
  const btn = document.getElementById('subscribe-btn');
  const btnText = btn.querySelector('.btn-text');
  const btnLoading = btn.querySelector('.btn-loading');
  const feedback = document.getElementById('subscribe-feedback');

  {% if site.buttondown_username %}
  const BUTTONDOWN_USERNAME = {{ site.buttondown_username | jsonify }};
  {% else %}
  const BUTTONDOWN_USERNAME = null;
  {% endif %}

  function showFeedback(message, isSuccess) {
    feedback.textContent = message;
    feedback.className = 'subscribe-feedback ' + (isSuccess ? 'subscribe-feedback--success' : 'subscribe-feedback--error');
    feedback.hidden = false;
  }

  function setLoading(loading) {
    btn.disabled = loading;
    btnText.hidden = loading;
    btnLoading.hidden = !loading;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = emailInput.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFeedback('Please enter a valid email address.', false);
      return;
    }

    if (!BUTTONDOWN_USERNAME) {
      showFeedback('Subscription is not configured yet. Please try again later.', false);
      return;
    }

    setLoading(true);
    feedback.hidden = true;

    try {
      const formData = new FormData();
      formData.append('email', email);

      const response = await fetch(
        'https://buttondown.email/api/emails/embed-subscribe/' + BUTTONDOWN_USERNAME,
        { method: 'POST', body: formData }
      );

      if (response.ok || response.status === 302) {
        showFeedback('You\'re subscribed! Check your inbox to confirm.', true);
        emailInput.value = '';
      } else if (response.status === 400) {
        const data = await response.json().catch(() => ({}));
        const msg = data.email ? data.email[0] : 'This email is already subscribed or invalid.';
        showFeedback(msg, false);
      } else {
        showFeedback('Something went wrong. Please try again.', false);
      }
    } catch (err) {
      showFeedback('Network error. Please check your connection and try again.', false);
    } finally {
      setLoading(false);
    }
  });
})();
</script>
