---
layout: page
title: Blog
description: Technical articles, tutorials, and insights
permalink: /blog/
blog_search: true
---

<div class="blog-layout">
<aside class="blog-sidebar">
  <h3 class="blog-sidebar-title"><i class="far fa-calendar-alt"></i> Archive</h3>
  <div class="blog-month-filters" id="month-filters" aria-label="Filter by month"></div>
</aside>

<div class="blog-main">
<div class="blog-controls">
  <div class="blog-search-wrapper">
    <i class="fas fa-search"></i>
    <input type="text" id="blog-search" placeholder="Search articles..." autocomplete="off" />
  </div>
  <div class="blog-category-filters" id="category-filters">
    <button class="category-btn active" data-category="all">All</button>
  </div>
</div>

<div id="pagination-controls-top" class="blog-pagination blog-pagination--top"></div>
<div id="posts-container" class="writing-list"></div>
<div id="pagination-controls" class="blog-pagination"></div>
<p id="no-results" class="no-results-msg" hidden>No posts found.</p>
</div>
</div>

<div style="margin-top: var(--space-xl);">{% include subscribe-section.html %}</div>

<script id="post-data" type="application/json">
[{% for post in site.posts %}
  {
    "title": {{ post.title | jsonify }},
    "url": "{{ post.url | relative_url }}",
    "date": "{{ post.date | date: '%B %d, %Y' }}",
    "month": "{{ post.date | date: '%Y-%m' }}",
    "monthLabel": "{{ post.date | date: '%b %Y' }}",
    "isoDate": "{{ post.date | date: '%Y-%m-%d' }}",
    "dateShort": "{{ post.date | date: '%b %-d, %Y' }}",
    "excerpt": {{ post.excerpt | strip_html | truncate: 200 | jsonify }},
    "description": {{ post.description | jsonify }},
    "categories": {{ post.categories | jsonify }},
    "tags": {{ post.tags | jsonify }},
    "image": {{ post.image | jsonify }},
    "readTime": {{ post.content | strip_html | number_of_words | divided_by: 200.0 | ceil | at_least: 1 }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}]
</script>
