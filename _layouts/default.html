<!DOCTYPE html>
<html lang="en" data-mode="dark" data-theme="orange-red">

<head>
  <meta charset="UTF-8">

  <!-- ⚡ Anti-FOUC: read theme from localStorage and apply BEFORE any render -->
  <script>
    (function () {
      var mode = localStorage.getItem('site-mode') || 'dark';
      var html = document.documentElement;
      html.setAttribute('data-mode', mode);
      html.setAttribute('data-theme', 'orange-red');
      // Suppress transition animations on first paint
      html.classList.add('no-transitions');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Open+Sans:wght@300;400;600;700&family=Raleway:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/projects/website-logo-matched.png' | relative_url }}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme-switcher.css' | relative_url }}">

  <!-- Remove no-transitions class after first paint so user interactions animate normally -->
  <script>
    window.addEventListener('load', function () {
      document.documentElement.classList.remove('no-transitions');
    });
  </script>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  {% seo %}
</head>

<body>
  <!-- Header -->
  <header class="site-header" id="header">
    <nav class="site-nav container">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <img src="{{ '/assets/images/projects/website-logo-matched.png' | relative_url }}" alt="{{ site.author }}"
          class="logo-img" width="40" height="40">
        <span class="logo-text">Shan's Digital Space</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>



      <!-- Theme toggle rendered inline — avoids JS-injection flicker -->
      <div id="modeToggleContainer">
        <button class="site-search-btn" id="site-search-btn" aria-label="Search site (Ctrl+K)" title="Search (⌘K)">
          <i class="fas fa-search"></i>
        </button>
        <label class="mode-switch" aria-label="Toggle dark/light mode">
          <input type="checkbox" id="modeToggle">
          <span class="mode-slider">
            <i class="fas fa-sun mode-icon-sun"></i>
            <i class="fas fa-moon mode-icon-moon"></i>
          </span>
        </label>
      </div>

      <ul class="nav-links" id="navLinks">
        <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
        <li><a href="{{ '/about/' | relative_url }}"
            class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a></li>
        <li><a href="{{ '/projects/' | relative_url }}"
            class="nav-link {% if page.url contains '/projects' %}active{% endif %}">Projects</a></li>
        <li><a href="{{ '/blog/' | relative_url }}"
            class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
        <li><a href="{{ '/contact/' | relative_url }}"
            class="nav-link {% if page.url contains '/contact' %}active{% endif %}">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p class="footer-copy">&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
        <div class="social-links">
          {% for link in site.social_links %}
          <a href="{{ link.url }}" class="social-link" target="_blank" rel="noopener" aria-label="{{ link.name }}">
            <i class="{{ link.icon }}"></i>
          </a>
          {% endfor %}
          <a href="tel:+919790050474" class="social-link" aria-label="Phone">
            <i class="fas fa-phone-alt"></i>
          </a>
          <a href="https://wa.me/919790050474" class="social-link" target="_blank" rel="noopener" aria-label="WhatsApp">
            <i class="fab fa-whatsapp"></i>
          </a>
        </div>
        <div class="footer-counter">
          <div class="counter-digits">
            <script type='text/javascript' src='https://www.freevisitorcounters.com/auth.php?id=5eae4d5930301d43fb2dd3648a2cd2c207fb0d34'></script>
            <script type="text/javascript" src="https://www.freevisitorcounters.com/en/home/counter/1529109/t/5"></script>
          </div>
          <a href='https://www.free-counters.org/' class="footer-counter-link">Visitors</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    // Mobile menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });

    // Header scroll effect
    const header = document.getElementById('header');
    let lastScroll = 0;

    window.addEventListener('scroll', () => {
      const currentScroll = window.pageYOffset;

      if (currentScroll > 50) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }

      lastScroll = currentScroll;
    });

    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>

  <!-- Site Search Modal -->
  <div id="site-search-overlay" class="site-search-overlay" role="dialog" aria-modal="true" aria-label="Site search">
    <div class="site-search-modal">
      <div class="site-search-header">
        <i class="fas fa-search site-search-icon"></i>
        <input
          type="text"
          id="site-search-input"
          class="site-search-input"
          placeholder="Search pages, posts, projects…"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="site-search-close" id="site-search-close" aria-label="Close search">
          <kbd>Esc</kbd>
        </button>
      </div>
      <div id="site-search-results" class="site-search-results">
        <p class="site-search-hint">Type to search pages, posts &amp; projects…</p>
      </div>
      <div class="site-search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Theme Switcher Script -->
  <script src="{{ '/assets/js/theme-switcher.js' | relative_url }}"></script>

  <!-- Fuse.js + Site Search -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="{{ '/assets/js/site-search.js' | relative_url }}"></script>

</body>

</html>
